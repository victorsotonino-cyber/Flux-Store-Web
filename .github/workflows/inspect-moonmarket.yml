name: Inspect MoonMarket reference structure
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-moonmarket.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and summarize permitted reference
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from html.parser import HTMLParser
          from collections import Counter
          import re,json
          raw=urlopen("https://raw.githubusercontent.com/Teminxx/MoonMarket/main/index.html",timeout=30).read().decode("utf-8","replace")
          print("SOURCE_BYTES",len(raw))
          style=re.search(r"<style[^>]*>(.*?)</style>",raw,re.I|re.S)
          styles=style.group(1) if style else ""
          root=re.search(r":root\s*\{([^}]+)\}",styles)
          print("ROOT_CSS",re.sub(r"\s+"," ",root.group(0))[:3000] if root else "none")
          for term in ["const DATOS_SEMILLA =","function renderTarjeta","function renderTipo","function precioMinimo","function tieneStock","function guardarProducto","function publicarDatos","function pedirClave","function comprobarClave","function guardarConfig","function renderAdmin","function irA"]:
              m=re.search(re.escape(term),raw)
              print("FUNCTION",term,"FOUND",bool(m))
              if m:
                  print("FUNCTION_SNIP",re.sub(r"\s+"," ",raw[m.start():m.start()+2600])[:2400])
          m=re.search(r"const DATOS_SEMILLA\s*=\s*(\{.*?\});\s*/\*\s*={4,}\s*Datos publicos",raw,re.S)
          if m:
              try:
                  seed=json.loads(m.group(1))
                  print("SEED_KEYS",list(seed.keys()))
                  print("CONFIG_KEYS",list(seed.get("config",{}).keys()))
                  print("FAQ_EXAMPLE",json.dumps(seed.get("faqs",[])[:2],ensure_ascii=False)[:1500])
                  print("PRODUCT_COUNT",len(seed.get("productos",[])))
                  for p in seed.get("productos",[])[:12]:
                      q={k:(v if k!="imagen" else (str(v)[:100] if v else "")) for k,v in p.items()}
                      print("PRODUCT_SCHEMA",json.dumps(q,ensure_ascii=False)[:1800])
              except Exception as e: print("SEED_JSON_ERROR",type(e).__name__,str(e)[:500],m.group(1)[:300])
          else: print("SEED_MATCH_NOT_FOUND")
          print("ADMIN_PASSWORD_SNIPS")
          for term in ['config.adminPassword || "gsp@gsp10"','const CONFIG_DEF','function comprobarClave','function guardarConfig']:
              i=raw.find(term)
              if i>=0: print("ADMIN",re.sub(r"\s+"," ",raw[max(0,i-400):i+1400])[:1600])
          PY
