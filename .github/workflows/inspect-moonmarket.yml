name: Inspect MoonMarket reference structure
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-moonmarket.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect data model
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          import json,re
          raw=urlopen("https://raw.githubusercontent.com/Teminxx/MoonMarket/main/index.html",timeout=30).read().decode("utf-8","replace")
          marker="const DATOS_SEMILLA = "
          start=raw.find(marker)+len(marker)
          while start<len(raw) and raw[start].isspace(): start+=1
          seed,end=json.JSONDecoder().raw_decode(raw,start)
          print("PRODUCT_KEYS",list(seed["productos"][0].keys()))
          print("PRODUCT_SAMPLE",json.dumps({k:v for k,v in seed["productos"][0].items() if k not in ("imagen","tipos")},ensure_ascii=False))
          print("TYPE_KEYS",list(seed["productos"][0]["tipos"][0].keys()))
          print("TYPE_SAMPLE",json.dumps({k:v for k,v in seed["productos"][0]["tipos"][0].items() if k!="caracteristicas"},ensure_ascii=False))
          for term in ["let productos =","function detalleUnidad","const CATEGORIAS","function enlaceDiscord","function renderTarjeta","function abrirDetalle","function abrirCompra(pid, tid)"]:
              i=raw.find(term)
              if i>=0: print("SNIP",term,re.sub(r"\s+"," ",raw[i:i+1700])[:1500])
          PY
